<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Drop 100</title>
<meta name="description" content="A percent quiz. 100 players drop on an island. Answer right, beat the storm and be the last one standing.">
<style>
:root{--ink:#12233f;--sky1:#0f3488;--sky2:#1c8fd6;--sun:#ffd21f;--storm:#e5338f;--ok:#14a155;--okbg:#dcf7e7;--bad:#d9364a;--badbg:#fde3e6;--soft:#eef3fb;--line:#c6d3e6;--shield:#27b6f2;--storm-a:0}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2) 75%,#7fd3f5);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 38%,var(--storm) 105%);opacity:var(--storm-a);transition:opacity .8s}
.screen{display:none;position:relative;max-width:860px;margin:0 auto;padding:16px}
.screen.on{display:block}
button{font:inherit;color:inherit;cursor:pointer}
.title{font-family:"Arial Black","Trebuchet MS",Impact,sans-serif;font-weight:900;text-transform:uppercase;font-style:italic;color:var(--sun);text-shadow:0 3px 0 var(--ink),0 0 2px var(--ink);letter-spacing:.5px;margin:0;line-height:1.05}
.big-btn{display:block;width:100%;max-width:360px;margin:12px auto 0;padding:16px 20px;font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:22px;font-weight:900;text-transform:uppercase;font-style:italic;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.big-btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--ink)}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.big-btn.ghost{background:#fff;font-size:17px;padding:11px 16px}
/* start */
#start{text-align:center;padding-top:22px}
#start .title{font-size:clamp(40px,9vw,68px)}
.sub{color:#fff;font-size:18px;font-weight:700;margin:6px 0 2px}
.hero{display:block;width:100%;max-width:620px;margin:6px auto 0}
.floaty{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(10px)}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px auto 4px;max-width:620px}
.step{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 6px;font-weight:800;font-size:15px;line-height:1.2}
.step b{display:block;font-size:24px;color:var(--storm);font-family:"Arial Black",sans-serif;font-style:italic}
/* hud */
.hud{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:8px 12px;margin-bottom:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.map{width:58px;height:58px}.map svg{display:block;width:100%;height:100%}
.leftBox{text-align:center;line-height:1}
.leftBox b{display:block;font-family:"Arial Black",sans-serif;font-size:30px;color:var(--sun);font-style:italic}
.leftBox span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.bars{display:grid;gap:5px;min-width:0}
.bar{position:relative;height:22px;background:#2e4266;border-radius:7px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .45s}
.bar span{position:relative;display:block;text-align:center;font-size:13px;font-weight:800;line-height:22px;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.bar.sh i{background:var(--shield)}.bar.pg i{background:var(--ok)}
.starBox{font-family:"Arial Black",sans-serif;font-size:20px;color:var(--sun);white-space:nowrap}
.icon{background:#2e4266;border:0;color:#fff;border-radius:9px;width:40px;height:40px;font-size:18px}
.icon.off{opacity:.45}
.hud.hit{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
/* question card */
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px 18px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.cardTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tag{background:var(--storm);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
.read{background:var(--soft);border:2px solid var(--line);border-radius:9px;font-weight:700;font-size:13px;padding:5px 10px}
.prompt{font-size:21px;font-weight:700;line-height:1.35;margin:6px 0 10px}
.art{text-align:center;margin:0 0 12px}
.art[hidden]{display:none}
.mini{display:inline-block;max-width:100%}.mini svg{display:block;max-width:100%;height:auto}
.note{display:block;font-size:14px;font-weight:600;color:#4a5d7a;margin-top:6px}
.sheet-art{width:100%;max-width:280px;height:auto}
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.one{grid-template-columns:1fr}
.opts.pics{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.pics.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:10px;min-height:58px;text-align:left;background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:8px 12px;font-size:20px;font-weight:800;transition:transform .08s,border-color .08s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;font-size:15px;line-height:30px;text-align:center}
.opt .t{min-width:0}
.pics .opt{flex-direction:column;align-items:center;text-align:center;padding:8px 6px;font-size:15px}
.pics .opt .t{width:100%;display:block}
.pics .mini{display:block;margin:0 auto 4px}.pics .mini svg{margin:0 auto}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.good .ltr{background:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);animation:hit .35s}.opt.bad .ltr{background:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.opt.dim:not(.good){opacity:.5}
.fb{margin-top:12px;font-size:17px;font-weight:600;line-height:1.4;border-radius:10px;padding:0}
.fb.on{padding:10px 12px}
.fb.good{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb b.h{font-weight:900}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-weight:800;line-height:1.1;margin:0 .15em;font-size:.92em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.tb{border-collapse:collapse;margin:0 auto;font-size:17px;font-weight:700}
.tb th,.tb td{border:2px solid var(--ink);padding:5px 14px}.tb th{background:var(--soft)}
#nextBtn{display:none;scroll-margin-bottom:16px}
#nextBtn.on{display:block}
/* drop overlay */
#drop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:#fff;overflow:hidden}
#drop.on{display:flex}
#drop svg{width:190px;animation:fall 1.3s ease-out both}
@keyframes fall{from{transform:translateY(-55vh) rotate(-8deg)}to{transform:none}}
#drop .title{font-size:34px;margin-top:6px}
/* end */
#end{text-align:center;padding-top:20px}
#end .title{font-size:clamp(32px,7vw,50px)}
.rank{font-family:"Arial Black",sans-serif;font-style:italic;font-size:88px;color:#fff;line-height:1;text-shadow:0 4px 0 var(--ink);margin:4px 0}
.score{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px;margin:12px auto;max-width:560px}
.score .pct{font-family:"Arial Black",sans-serif;font-size:50px;color:var(--ok);line-height:1.1}
.score p{margin:4px 0;font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 0}
.stats div{background:var(--soft);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:700}
.stats b{display:block;font-size:22px;font-family:"Arial Black",sans-serif}
.again{margin:10px 0 0;text-align:left;font-size:16px;font-weight:600}
.again ul{margin:4px 0 0;padding-left:20px}
.teacher{color:#fff;font-weight:800;font-size:17px;margin:8px 0 0}
/* toast and confetti */
#toast{position:fixed;left:50%;bottom:18px;z-index:30;transform:translate(-50%,200%);visibility:hidden;background:var(--ink);color:#fff;font-weight:800;font-size:16px;padding:10px 16px;border-radius:12px;border:2px solid var(--sun);transition:transform .25s,visibility .25s;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
#confetti i{position:absolute;top:-16px;width:10px;height:14px;animation:cf 2.8s linear forwards}
@keyframes cf{to{transform:translateY(106vh) rotate(720deg)}}
@media (max-width:560px){
  .screen{padding:10px}
  .hud{grid-template-columns:auto auto 1fr auto;gap:8px;padding:8px}
  .bars{grid-column:1 / -1;grid-row:2}
  .map{width:48px;height:48px}
  .prompt{font-size:19px}
  .opt{font-size:18px;padding:8px}
  .pics .opt{padding:6px 3px;font-size:13px}
  .pics .opt .ltr{width:24px;height:24px;line-height:24px;font-size:13px}
  .steps .step{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.floaty,#drop svg,.hud.hit,.opt.bad{animation:none}}
</style>
</head>
<body>

<section class="screen on" id="start">
  <h1 class="title">Storm Drop 100</h1>
  <p class="sub">A percent quiz. Percent means "out of 100".</p>
  <div id="hero"></div>
  <div class="steps">
    <div class="step"><b>1</b>100 players drop on the island</div>
    <div class="step"><b>2</b>Tap the right answer</div>
    <div class="step"><b>3</b>Beat the storm. Be the last one standing</div>
  </div>
  <button class="big-btn" id="goBtn">Drop in!</button>
  <button class="big-btn ghost" id="newBtn" style="display:none">Start a new game</button>
</section>

<section class="screen" id="play">
  <header class="hud" id="hud">
    <div class="map" id="map"></div>
    <div class="leftBox"><b id="left">100</b><span>players left</span></div>
    <div class="bars">
      <div class="bar sh"><i id="shBar"></i><span id="shTxt"></span></div>
      <div class="bar pg"><i id="pgBar"></i><span id="pgTxt"></span></div>
    </div>
    <div class="starBox">★ <span id="stars">0</span></div>
    <button class="icon" id="sndBtn" aria-label="Turn the sound on or off">♪</button>
  </header>
  <main class="card">
    <div class="cardTop"><span class="tag" id="tag"></span><button class="read" id="readBtn">🔊 Read to me</button></div>
    <p class="prompt" id="prompt"></p>
    <div class="art" id="art"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="big-btn" id="nextBtn">Next ▶</button>
  </main>
</section>

<section class="screen" id="end">
  <h1 class="title" id="endTitle"></h1>
  <div class="rank" id="endRank"></div>
  <div class="score">
    <div class="pct" id="endPct"></div>
    <p id="endLine"></p>
    <div class="stats">
      <div><b id="endStars"></b>stars</div>
      <div><b id="endShield"></b>shield left</div>
      <div><b id="endStreak"></b>best streak</div>
    </div>
    <div class="again" id="endAgain"></div>
  </div>
  <p class="teacher">Show this screen to your teacher.</p>
  <button class="big-btn" id="againBtn">Play again</button>
</section>

<div id="drop"><svg id="dropArt" viewBox="0 0 200 170" role="img" aria-label="Your player gliding down"></svg><div class="title">Dropping in…</div></div>
<div id="toast" role="status"></div>
<div id="confetti" aria-hidden="true"></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// ---------------- audio: original music and sound effects, made live with Web Audio ----------------
var AC = null, soundOn = true, NOISE = null, MASTER = null;
function ac() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createGain(); MASTER.gain.value = 0.7; MASTER.connect(AC.destination);
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    var d = NOISE.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
var hz = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };
function toneAt(f, t, d, type, v, f2) {
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + Math.min(0.012, d / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.05);
}
function noiseAt(t, d, v, freq) {
  var s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = 'bandpass'; f.frequency.value = freq || 1800; f.Q.value = 0.8;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t); s.stop(t + d + 0.05);
}
function fx(fn) { if (!soundOn) return; try { ac(); fn(AC.currentTime + 0.01); } catch (e) { } }
var SFX = {
  drop: function () { fx(function (t) { toneAt(900, t, 1.0, 'sine', 0.07, 160); noiseAt(t, 1.0, 0.05, 1200); }); },
  ok: function () { fx(function (t) { [64, 67, 72, 76].forEach(function (m, i) { toneAt(hz(m + 12), t + i * 0.07, 0.4, 'triangle', 0.09); }); noiseAt(t, 0.12, 0.05, 5000); }); },
  star: function () { fx(function (t) { [84, 88, 91, 96].forEach(function (m, i) { toneAt(hz(m), t + i * 0.05, 0.4, 'sine', 0.05); }); }); },
  hit: function () { fx(function (t) { toneAt(180, t, 0.3, 'sawtooth', 0.07, 70); noiseAt(t, 0.25, 0.09, 500); }); },
  shield: function () { fx(function (t) { [67, 71, 74, 79].forEach(function (m, i) { toneAt(hz(m + 12), t + i * 0.06, 0.45, 'sine', 0.07); }); }); },
  win: function () { fx(function (t) { [[60, 0], [64, 0.15], [67, 0.3], [72, 0.45], [67, 0.75], [72, 0.9], [76, 1.05]].forEach(function (p, i) { toneAt(hz(p[0] + 12), t + p[1], i === 6 ? 1.6 : 0.4, 'triangle', 0.1); }); [48, 55, 64].forEach(function (m) { toneAt(hz(m), t + 1.05, 1.8, 'sine', 0.09); }); for (var k = 0; k < 6; k++) noiseAt(t + k * 0.15, 0.12, 0.05, 5000); }); }
};
// music: a driving loop in a minor key (Am, F, C, G) with a pulsing bass
var Music = {
  timer: null, next: 0, beat: 0,
  start: function () {
    this.stop(); if (!soundOn) return;
    try { ac(); } catch (e) { return; }
    this.beat = 0; this.next = AC.currentTime + 0.2;
    var self = this; this.timer = setInterval(function () { self.tick(); }, 60);
  },
  tick: function () { while (this.next < AC.currentTime + 0.25) { this.play(this.next, this.beat); this.next += 0.21; this.beat++; } },
  play: function (t, b) {
    var bar = Math.floor(b / 16) % 4, root = [45, 41, 48, 43][bar], ch = [[69, 72, 76], [65, 69, 72], [67, 72, 76], [67, 71, 74]][bar];
    toneAt(hz(root - 12), t, 0.18, 'triangle', 0.075);
    if (b % 4 === 0) toneAt(120, t, 0.12, 'sine', 0.11, 50);
    if (b % 8 === 4) noiseAt(t, 0.1, 0.035, 1800);
    if (b % 2 === 1) noiseAt(t, 0.03, 0.016, 8000);
    var riff = [0, 2, 1, 2, 0, 1, 2, 1];
    if ([0, 3, 6, 8, 11, 14].indexOf(b % 16) >= 0) toneAt(hz(ch[riff[b % 8]]), t, 0.22, 'square', 0.014);
  },
  stop: function () { if (this.timer) clearInterval(this.timer); this.timer = null; }
};
document.addEventListener('visibilitychange', function () { if (document.hidden) Music.stop(); else if (S && $('play').classList.contains('on')) Music.start(); });

// ---------------- drawings ----------------
var C = { grid: '#2e86de', tenths: '#119c7f', bar: '#e07b16' };
function glider() {
  return '<g><path d="M100 8 L188 62 L100 46 L12 62 Z" fill="#ffd21f" stroke="#12233f" stroke-width="4" stroke-linejoin="round"/><path d="M100 8 L100 46 L12 62 Z" fill="#e5338f" stroke="#12233f" stroke-width="4" stroke-linejoin="round"/>' +
    '<path d="M44 57 L90 100 M156 57 L110 100" stroke="#12233f" stroke-width="3"/>' +
    '<rect x="84" y="118" width="32" height="34" rx="9" fill="#2e86de" stroke="#12233f" stroke-width="4"/><circle cx="100" cy="102" r="20" fill="#fff" stroke="#12233f" stroke-width="4"/><rect x="85" y="94" width="30" height="13" rx="6" fill="#12233f"/><rect x="90" y="97" width="10" height="4" rx="2" fill="#7fd3f5"/>' +
    '<path d="M84 128 L68 112 M116 128 L132 112" stroke="#12233f" stroke-width="6" stroke-linecap="round"/><path d="M92 152 v12 M108 152 v12" stroke="#12233f" stroke-width="6" stroke-linecap="round"/></g>';
}
function heroSVG() {
  function tree(x, y, s) { return '<rect x="' + (x - 3 * s) + '" y="' + (y - 4 * s) + '" width="' + (6 * s) + '" height="' + (12 * s) + '" fill="#7a4a24"/><path d="M' + (x - 16 * s) + ' ' + (y - 2 * s) + ' L' + x + ' ' + (y - 34 * s) + ' L' + (x + 16 * s) + ' ' + (y - 2 * s) + ' Z" fill="#1f8a3b" stroke="#12233f" stroke-width="2.5"/>'; }
  function crate(x, y) { return '<rect x="' + x + '" y="' + y + '" width="30" height="24" rx="3" fill="#ffd21f" stroke="#12233f" stroke-width="3"/><rect x="' + x + '" y="' + (y + 8) + '" width="30" height="6" fill="#e5338f"/><rect x="' + (x + 12) + '" y="' + (y + 6) + '" width="6" height="10" fill="#fff" stroke="#12233f" stroke-width="1.5"/>'; }
  return '<svg class="hero" viewBox="0 0 640 290" role="img" aria-label="A player glides down to a round island while a pink storm closes in around it.">' +
    '<g fill="#fff" opacity=".75"><ellipse cx="90" cy="60" rx="52" ry="16"/><ellipse cx="124" cy="48" rx="34" ry="15"/><ellipse cx="540" cy="86" rx="58" ry="16"/><ellipse cx="505" cy="74" rx="32" ry="14"/></g>' +
    '<ellipse cx="320" cy="238" rx="312" ry="50" fill="#e5338f" opacity=".35"/>' +
    '<ellipse cx="320" cy="238" rx="254" ry="44" fill="#2aa7e0"/>' +
    '<ellipse cx="320" cy="238" rx="228" ry="36" fill="#f2d68a" stroke="#12233f" stroke-width="3"/><ellipse cx="320" cy="232" rx="196" ry="26" fill="#4bb543"/>' +
    tree(190, 232, 1) + tree(235, 226, .8) + tree(440, 230, 1) + tree(404, 224, .75) + crate(280, 222) + crate(340, 228) +
    '<ellipse cx="320" cy="238" rx="282" ry="47" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 9"/>' +
    '<g transform="translate(232 8) scale(.88)"><g class="floaty">' + glider() + '</g></g></svg>';
}
function mapSVG() {
  var p = (S.qi + (S.solved ? 1 : 0)) / Q.length, r = (44 - 36 * p).toFixed(1), d = 2 * r;
  return '<svg viewBox="0 0 100 100" role="img" aria-label="Map of the island. The storm closes in as you answer."><circle cx="50" cy="50" r="48" fill="#2aa7e0"/><path d="M50 13c18-3 35 9 37 29s-8 37-30 43-41-6-44-28 15-41 37-44z" fill="#4bb543"/>' +
    '<path fill="#e5338f" fill-opacity=".6" fill-rule="evenodd" d="M2 50a48 48 0 1 0 96 0a48 48 0 1 0-96 0zM' + (50 - r) + ' 50a' + r + ' ' + r + ' 0 1 0 ' + d + ' 0a' + r + ' ' + r + ' 0 1 0-' + d + ' 0z"/>' +
    '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="50" cy="50" r="6" fill="#ffd21f" stroke="#12233f" stroke-width="2.5"/></svg>';
}
function frac(a, b) {
  var say = a === '1' && b === '2' ? 'and a half' : (a === '?' ? 'what number' : a) + ' over ' + b;
  return '<span class="fr" data-say="' + say + '"><span>' + a + '</span><span>' + b + '</span></span>';
}
// a grid is shaded one column at a time from the left; a part column fills from the bottom up
function gridSVG(n, o) {
  o = o || {}; var P = o.plates || Math.max(1, Math.ceil(n / 100)), W = P * 140 + (P - 1) * 16, s = '', p, c, r, k;
  for (p = 0; p < P; p++) {

  var seen = {}; S.missed.forEach(function (i) { var t = Q[i].tag; (seen[t] = seen[t] || []).push(i + 1); });
  var keys = Object.keys(seen);
  $('endAgain').innerHTML = keys.length ? '<b>Practise these again:</b><ul>' + keys.map(function (t) { return '<li>' + t + ' (question ' + seen[t].join(', ') + ')</li>'; }).join('') + '</ul>' : '';
  document.documentElement.style.setProperty('--storm-a', '0');
  wipe(); Music.stop(); show('end'); SFX.win(); confetti();
}

// ---------------- reading aloud with the device's own voice ----------------
var CAN_SPEAK = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function plain(el) {
  var c = el.cloneNode(true);
  [].forEach.call(c.querySelectorAll('.fr'), function (f) { f.replaceWith(' ' + f.getAttribute('data-say') + ' '); });
  [].forEach.call(c.querySelectorAll('svg'), function (s) { s.remove(); });
  return c.textContent.replace(/\s+/g, ' ').trim();
}
function readAloud() {
  if (!CAN_SPEAK) return;
  var txt = plain($('prompt')), q = Q[S.qi];
  [].forEach.call($('opts').children, function (b, i) { var t = plain(b.querySelector('.t')); txt += ' ' + 'ABCD'[i] + '. ' + (t || 'picture') + '.'; });
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(txt); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) { }
}

// ---------------- starting ----------------
function begin(saved) {
  S = saved || fresh();
  if (S.solved) { S.qi++; S.tries = 0; S.solved = false; }
  if (S.qi >= Q.length) { finish(); return; }
  show('play'); renderQ(); save(); Music.start();
}
function drop(saved) {
  try { ac(); } catch (e) { }
  SFX.drop();
  var d = $('drop'); d.classList.add('on');
  setTimeout(function () { d.classList.remove('on'); begin(saved); }, RM ? 500 : 1400);
}
function setupStart() {
  var sv = load();
  $('goBtn').textContent = sv ? 'Continue' : 'Drop in!';
  $('newBtn').style.display = sv ? 'block' : 'none';
}
$('hero').innerHTML = heroSVG();
$('dropArt').innerHTML = glider();
$('goBtn').onclick = function () { drop(load()); };
$('newBtn').onclick = function () { wipe(); drop(null); };
$('againBtn').onclick = function () { wipe(); drop(null); };
$('nextBtn').onclick = next;
$('opts').addEventListener('click', function (e) { var b = e.target.closest('.opt'); if (b) answer(+b.getAttribute('data-i')); });
$('readBtn').onclick = readAloud;
if (!CAN_SPEAK) $('readBtn').style.display = 'none';
$('sndBtn').onclick = function () {
  soundOn = !soundOn; this.classList.toggle('off', !soundOn);
  if (soundOn) Music.start(); else { Music.stop(); if (CAN_SPEAK) speechSynthesis.cancel(); }
};
setupStart();

// test hooks
window.__game = { get S() { return S; }, set S(v) { S = v; }, Q: Q, answer: answer, next: next, begin: begin, finish: finish, renderQ: renderQ, fresh: fresh, load: load, wipe: wipe, setupStart: setupStart };
</script>
